name: Deploy App Store to GitHub Pages

# The app store in docs/ is generated from catalog/products.py, so it can never
# drift from the products the platform sells. This workflow rebuilds it on every
# push to main and publishes it to GitHub Pages.
#
# One-time setup in the repository:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate docs/index.html from the catalog
        env:
          STORE_GITHUB_URL: ${{ github.server_url }}/${{ github.repository_owner }}
          STORE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python tools/build_store.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "## App Store deployed"
            echo ""
            echo "Live at ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
